<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан-доска</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Канбан-доска</h1>
    </header>

    <!-- ===== Панель инструментов ===== -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-search">
            <svg class="toolbar-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" class="toolbar-input" placeholder="Поиск задач...">
        </div>
        <div class="toolbar-filter">
            <select id="priorityFilter" class="toolbar-select">
                <option value="">Все приоритеты</option>
                <option value="low">Низкий</option>
                <option value="medium">Средний</option>
                <option value="high">Высокий</option>
            </select>
        </div>
        <div class="toolbar-results" id="toolbarResults"></div>
    </div>

    <main class="board" id="board">
        <!-- Колонки генерируются через JS -->
    </main>

    <!-- Кнопка добавления колонки -->
    <div class="add-column-area">
        <button class="add-column-btn" type="button" id="addColumnBtn">+ Добавить колонку</button>
    </div>

    <!-- ===== Модальное окно задачи ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Описание задачи</h3>
                <button class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <label for="modalDescription">Описание</label>
                <textarea id="modalDescription" class="modal-textarea" placeholder="Добавьте описание задачи..." rows="4"></textarea>

                <label for="modalPriority">Приоритет</label>
                <select id="modalPriority" class="modal-select">
                    <option value="">Без приоритета</option>
                    <option value="low">Низкий</option>
                    <option value="medium">Средний</option>
                    <option value="high">Высокий</option>
                </select>

                <label for="modalDeadline">Дедлайн</label>
                <input type="date" id="modalDeadline" class="modal-date">
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" type="button">Отмена</button>
                <button class="modal-btn modal-btn-primary" type="button">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ===== Модальное окно удаления колонки ===== -->
    <div class="modal-overlay" id="columnModalOverlay">
        <div class="modal column-delete-modal">
            <div class="modal-header">
                <h3 class="modal-title">Удалить колонку</h3>
                <button class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <p id="columnDeleteMessage">Вы уверены, что хотите удалить эту колонку?</p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" type="button" id="columnCancelBtn">Отмена</button>
                <button class="modal-btn modal-btn-danger" type="button" id="columnConfirmBtn">Удалить</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
