<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан-доска</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Канбан-доска</h1>
    </header>

    <main class="board">
        <div class="column" data-status="todo">
            <h2>К выполнению</h2>
            <div class="cards"></div>
            <div class="add-task-form">
                <input type="text" class="task-input" placeholder="Название задачи..." maxlength="120">
                <button class="add-task-btn" type="button">Добавить</button>
            </div>
        </div>
        <div class="column" data-status="progress">
            <h2>В работе</h2>
            <div class="cards"></div>
            <div class="add-task-form">
                <input type="text" class="task-input" placeholder="Название задачи..." maxlength="120">
                <button class="add-task-btn" type="button">Добавить</button>
            </div>
        </div>
        <div class="column" data-status="done">
            <h2>Готово</h2>
            <div class="cards"></div>
            <div class="add-task-form">
                <input type="text" class="task-input" placeholder="Название задачи..." maxlength="120">
                <button class="add-task-btn" type="button">Добавить</button>
            </div>
        </div>
    </main>

    <!-- ===== Модальное окно ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Описание задачи</h3>
                <button class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <label for="modalDescription">Описание</label>
                <textarea id="modalDescription" class="modal-textarea" placeholder="Добавьте описание задачи..." rows="6"></textarea>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" type="button">Отмена</button>
                <button class="modal-btn modal-btn-primary" type="button">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
